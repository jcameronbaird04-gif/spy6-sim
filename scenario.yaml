# SPY-6 vs SPY-1D kill-chain scenario (what the simulation in index.html runs)
# Units: km, km/s, seconds, m^2. Values marked "illustrative" are modeling choices, not published data.

ship:
  class: Arleigh Burke Flight III (DDG-128 style)
  weapons: [SM-2, SM-6, SM-3 Block IIA, Mk 45 5-inch gun, Phalanx CIWS]

radars:
  SPY-1D:
    sensitivity_db: 0                  # reference
    beams: one analog beam per face, time-shared between search and tracks
    track_capacity: ~24 per face, ~96 for the ship   # calibrated to the published "more than 100 targets"
  SPY-6(V)1:
    sensitivity_db: 15                 # published (NAVSEA): +15 dB, about 30x
    range_ratio_same_target: 2.37      # (10^1.5)^(1/4), from the radar range equation
    beams: digital beamforming, a beam per track in parallel, every track every 0.25 s
    track_capacity: ~720 per face      # 30x SPY-1D (published "over 30 times as many targets")

acts:                                  # one thing at a time
  1_ballistic: from T+0:20             # anti-ship ballistic missile + a ballistic missile through space with 3 decoys
  2_jamming_and_sea_skimmers: from T+6:50
  3_drone_swarm: from T+9:20

threats:                               # 39 total
  - {id: D1-D3, type: one-way attack drone, count: 3, speed_kmps: 0.0514, rcs_m2: 0.1}   # Shahed-class, ~185 km/h
  - {id: C1-C2, type: anti-ship cruise missile, count: 2, speed_kmps: 0.25, rcs_m2: 0.1, profile: sea-skimming}
  - {id: A1, type: anti-ship ballistic missile, count: 1, rcs_m2: 0.05, target: own ship}
  - {id: B1, type: medium-range ballistic missile, count: 1, rcs_m2: 0.2, apogee_km: ~250, decoys: 3}
  - {id: D4, type: drone, count: 1, weapon: 5-inch gun}
  - {id: D5, type: pop-up drone, count: 1, weapon: CIWS}
  - {id: S1-S30, type: drone swarm, count: 30, launch: "T+9:20, 1 s apart, one direction (NE face)"}  # sized past SPY-1D's per-face capacity

showcase_events:
  1_range:          A1 first detected at 215 nm (SPY-6) vs 102 nm (SPY-1D); warning before impact 7:02 vs 2:41
  2_capacity:       30-drone swarm; SPY-1D's NE face fills at ~23 tracks, up to 8 drones fly in untracked; swarm cleared T+10:55 vs T+11:45
  3_jamming:
    start_s: 410
    jammer: stand-off EW aircraft, bearing 100, ~97 nm (covers the eastern drones, not the ASBM at 074)
    sector_half_width_deg: 12
    range_kept: {SPY-1D: 0.15, SPY-6: 0.95}   # illustrative; SPY-6 steers an adaptive null
  4_discrimination:
    decoys_release: 17% of B1 flight
    time_to_pick_warhead_s: {SPY-6: 6, SPY-1D: 40}   # illustrative; driven by bandwidth (range resolution c/2B)
  5_availability:   in the paper and Fig 6 (SPY-1 calibration downtime vs SPY-6 graceful degradation)

outcome: both radars stop all 39 threats. SPY-6 sees earlier, never runs out of tracks, holds range under jamming,
  and kills the space threat about 70 s sooner: more time and margin, not a different result.

export: the Results tab has a "Download results (CSV)" button with every number for both radars.
