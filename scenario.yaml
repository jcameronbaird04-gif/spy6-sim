# SPY-6 vs SPY-1D kill-chain scenario (what the simulation in index.html runs)
# Units: km, km/s, seconds, m^2. Values marked "illustrative" are modeling choices, not published data.

ship:
  class: Arleigh Burke Flight III (DDG-128 style)
  weapons: [SM-2, SM-6, SM-3 Block IIA, Mk 45 5-inch gun, Phalanx CIWS]

radars:
  SPY-1D:
    sensitivity_db: 0            # reference
    beams: one analog beam per face, time-shared between search and tracks
  SPY-6(V)1:
    sensitivity_db: 15           # published (NAVSEA): +15 dB, about 30x
    range_ratio_same_target: 2.37  # (10^1.5)^(1/4), from the radar range equation
    beams: digital beamforming, a beam per track in parallel

threats:                         # 17 total, launched over about 6 minutes
  - {id: D1-D3, type: one-way attack drone, count: 3, speed_kmps: 0.0514, rcs_m2: 0.1}   # Shahed-class, ~185 km/h
  - {id: C1-C2, type: anti-ship cruise missile, count: 2, speed_kmps: 0.25, rcs_m2: 0.1, profile: sea-skimming}
  - {id: A1, type: anti-ship ballistic missile, count: 1, rcs_m2: 0.05, target: own ship}
  - {id: B1, type: medium-range ballistic missile, count: 1, rcs_m2: 0.2, apogee_km: ~250, decoys: 3}
  - {id: D4, type: drone, count: 1, weapon: 5-inch gun}
  - {id: D5, type: pop-up drone, count: 1, weapon: CIWS}
  - {id: S1-S8, type: drone swarm, count: 8, launch: "T+5:00, 1.5 s apart"}

showcase_events:                 # the five advantages, each shown in the sim with a callout
  1_range:          A1 detection range, SPY-6 vs SPY-1D (~215 nm vs ~43 nm)
  2_capacity:       8-drone swarm; SPY-1D track updates slow and tracks drop (TRACK LOST)
  3_jamming:
    start_s: 160
    jammer: stand-off EW aircraft, bearing 074, ~96 nm
    sector_half_width_deg: 12
    range_kept: {SPY-1D: 0.42, SPY-6: 0.95}   # illustrative; SPY-6 steers an adaptive null
  4_discrimination:
    decoys_release: 17% of B1 flight
    time_to_pick_warhead_s: {SPY-6: 6, SPY-1D: 40}   # illustrative; driven by bandwidth (range resolution c/2B)
  5_availability:   shown in the charts and paper (SPY-1 calibration downtime vs SPY-6 graceful degradation)

outcome:                         # both radars defeat the raid (Carney did it with SPY-1D)
  difference: SPY-6 sees earlier, keeps every track, holds range under jamming, and kills the
              space threat about 70 s sooner, leaving more time and margin.
